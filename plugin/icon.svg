<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="GodotWebViewSharp">
  <title>GodotWebViewSharp</title>
  <desc>A browser window rendered inside a Godot-blue frame: the Godot WebView plugin.</desc>

  <defs>
    <!-- Godot blue frame -->
    <linearGradient id="gws-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA0D6"/>
      <stop offset="1" stop-color="#2A669F"/>
    </linearGradient>
    <!-- WebView2 / Edge blue -> teal -->
    <linearGradient id="gws-web" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0A66C2"/>
      <stop offset="1" stop-color="#3FC1F2"/>
    </linearGradient>
  </defs>

  <!-- frame -->
  <rect x="0" y="0" width="64" height="64" rx="13" fill="url(#gws-bg)"/>

  <!-- webview window -->
  <rect x="10" y="14" width="44" height="36" rx="5" fill="#FFFFFF"/>
  <path d="M10 19a5 5 0 0 1 5-5h34a5 5 0 0 1 5 5v3H10z" fill="#E9F2FB"/>

  <!-- window buttons -->
  <g fill="#478CBF">
    <circle cx="15.5" cy="18" r="1.6"/>
    <circle cx="20.5" cy="18" r="1.6" opacity=".6"/>
    <circle cx="25.5" cy="18" r="1.6" opacity=".32"/>
  </g>

  <!-- globe -->
  <g fill="none" stroke="url(#gws-web)" stroke-linecap="round">
    <circle cx="32" cy="36" r="10.5" stroke-width="2.2"/>
    <ellipse cx="32" cy="36" rx="8.2" ry="10.5" stroke-width="1.5" opacity=".5"/>
    <ellipse cx="32" cy="36" rx="4.8" ry="10.5" stroke-width="1.5"/>
    <path d="M22.4 36h19.2" stroke-width="1.6"/>
  </g>
</svg>